<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Long-lived cache for fingerprinted Vite assets only; HTML stays uncached
    # so stock levels are never served stale.
    <Directory /var/www/html/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
